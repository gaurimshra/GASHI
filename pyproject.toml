[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gashi-guard"
version = "0.1.0"
description = "Zero-Trust Security Runtime & Guardrails SDK for Autonomous Web Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "GASHI Security Team" }
]
dependencies = [
    "playwright>=1.42.0",
    "beautifulsoup4>=4.12.0",
    "pydantic>=2.6.0",
    "pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.setuptools.packages.find]
include = ["gashi*"]

